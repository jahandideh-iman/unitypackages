name: release

# Under the OpenUPM model a git tag <package-name>/<version> IS the release:
# there is no upload step and no registry secret. OpenUPM's build pipeline
# watches this repo's tags and builds the versions itself, typically within
# 15-30 minutes. See docs/specs/2026-08-23-upm-package-registry-github-design.md.
#
# Branch roles: `dev` is where development lands, `master` is release-only and
# moves solely via a release PR from `dev`. `validate` + `pack` run on both, so a
# change is checked when it merges to `dev` and again when it is promoted; `tag`
# runs only from `master`.
#
# ⚠️ Merging a release PR into `master` PUBLISHES. The `tag` job runs on that
# push and tags every package whose version is not tagged yet; OpenUPM picks the
# tags up and the resulting name/version is permanent. Bump versions on `dev`
# and let them sit there until you mean to release.
#
# The `workflow_dispatch` gate this job used to carry was rollout step 4's
# safeguard — a single-package smoke test (com.arman.service-locating) had to
# settle the Package Manager visibility question in §5 before the rest were
# submitted. That test passed and all 17 packages went out on 2026-08-31, so the
# gate was dropped per rollout step 5 and merging the release PR is now the whole
# release flow, as designed.

on:
  pull_request:
  push:
    branches: [master, dev]

jobs:
  # `master` may only be reached from `dev`. A ruleset can require this check
  # but cannot express the rule — rulesets target a destination ref and say
  # nothing about a pull request's source branch. The branch logic lives in the
  # script, not in an `if:` on this job: a skipped job reports `skipped`, and a
  # skipped required check blocks the merge.
  promotion-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # From the event, through the environment — never interpolated into the
      # shell body, where a branch name would be an injection seam.
      - name: Check the pull request's source branch
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node Tools/promotion-check.mjs

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node Tools/upm-release.mjs validate

  pack:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node Tools/upm-release.mjs pack --out PackageExports
      - uses: actions/upload-artifact@v7
        with:
          name: upm-tarballs
          path: PackageExports/
          retention-days: 30

  tag:
    needs: [validate, pack]
    # The ref condition is the one thing standing between a routine push to
    # `dev` and publishing 17 packages — `master` is the release branch, so a tag
    # can never be cut from `dev`. Keep it. (`Tools/upm-release.mjs tag` refuses
    # to run off `master` too, deliberately belt and braces.)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      # The only permission needed. No registry secret exists in this pipeline.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags must be visible locally for the script to diff against them.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # `git tag -a` needs an identity.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Idempotent: a package whose <name>/<version> tag already exists is
      # skipped, so a push to `master` that changes no version tags nothing.
      - name: Create and push tags
        run: node Tools/upm-release.mjs tag --push

  # The release tooling's own tests. `prepare` rewrites CHANGELOGs and version
  # fields, and a release is permanent, so its arithmetic is not something to
  # find out about afterwards. Named for uniqueness: changelog.yml owns `test`.
  release-script-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test Tools/upm-release.test.mjs Tools/upm-release.prepare.test.mjs Tools/promotion-check.test.mjs
